<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/semestres.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Semestres</title>
</head>
<body>
    <div id="Menu">
        <div id="PrimeiroMenu">

            <div class="logo">
                <img src="img/logo.png" alt="Organizador-Academico">
                 <h1>Organizador-Academico</h1>
            </div>

             <div class="perfil">

            <div class="info-perfil">
                <span>Danilo</span>
                <small>RA: 1222101103</small>
            </div>
           
           </div>
        </div>
        <div class="menu-links">

        <div>DASH</div>

        <div>PERFIL</div>

        <div>SEMESTRES</div>

        <div>DISCIPLINAS</div>

        <div>ATIV.</div>

        <div>NOTAS</div>

        <div>CONFIG</div>

        </div>

    </div>

    <div id="DivTitulo">

        <div id="Titulo">
         <H1>Semestres</H1>
         <p>Gerencie os semestres letivos e suas disciplinas</p>   
        </div>

        <select id="filtroStatusSemestre">
        <option value="S">Ativo</option>
        <option value="N">Inativo</option>
       </select>

        <div id="Divbotao-criarSmestres">
            <button id="botao-criarSemestres" type="button" data-bs-toggle="modal" data-bs-target="#modalCriarSemestre" >Criar Semestres</button>
        </div>
    </div>
    

    <div id="listaSemestres"></div>
    
    <template id="modeloSemestre">
        <div class="card-semestre">
            <div class="cabecalhoSemestre">
                <h2 class="nome-semestre"></h2>

                <button class="botaoOpcoesSemestre" type="button">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>

            <p>
                <strong>Ano:</strong>
                <span class="ano-semestre"></span>
            </p>
             <p>
                 <strong>Início:</strong>
                 <span class="inicio-semestre"></span>
             </p>
         
             <p>
                 <strong>Fim:</strong>
                 <span class="fim-semestre"></span>
             </p>

             <a href="diciplina.html" id="DisciplinasIr">Disciplinas</a>
             <button class="botao-excluir-semestre"> Excluir</button>
        </div>
    </template>   

<div class="modal fade" id="modalCriarSemestre" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="tituloModalSemestre" class="modal-title">Criar novo semestre</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
         <label for="nomeSemestre">Nome do semestre</label>
         <input type="text" class="form-control" id="nomeSemestre" placeholder="Ex: Semestre 2026.1">

         <div id ="linhaAnoStatus">
             <div>
                 <label for="anoSemestre">Ano</label>
                 <input type="number" class="form-control" id="anoSemestre" placeholder="Ex: 2026">
               </div>
             <div>  
                 <label for="ativoSemestre">Status</label>
                 <select id="ativoSemestre" class="form-control">
                     <option value="S">Ativo</option>
                     <option value="N">Inativo</option>
                    </select>
                </div>  
           </div>

         <div id="datasSemestre">
             <div>
                 <label for="inicioSemestre">Início</label>
                 <input type="date"class="form-control"  id="inicioSemestre">
                </div>

             <div>
                 <label for="fimSemestre">Fim</label>
                 <input type="date"class="form-control" id="fimSemestre">
                </div>
            </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Sair</button>
        <button type="button"  id="salvarSemestre"class="btn btn-primary">Confimar</button>
      </div>
    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/semestres.js"></script>
</body>
</html>
