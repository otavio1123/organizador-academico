<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha - Organizador Acadêmico</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="pagina-recuperacao">

        <section class="caixa-recuperacao">

            <h1>Esqueci minha senha</h1>

            <p class="texto-recuperacao">
                Informe o e-mail cadastrado na sua conta para receber
                as instruções de redefinição de senha.
            </p>

            <form id="formRecuperar" class="form-recuperacao">

                <input
                    type="email"
                    id="emailRecuperacao"
                    name="email"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                >

                <button id="botaoRecuperar" type="submit">
                    Enviar instruções
                </button>

            </form>

            <div class="voltar-login">
                <a href="index.html">Voltar para o login</a>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/recuperar.js"></script>

</body>

</html>
