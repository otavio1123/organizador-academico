<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha - Organizador Acadêmico</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="pagina-recuperacao">

        <section class="caixa-recuperacao">

            <h1>Esqueci minha senha</h1>

            <p class="texto-recuperacao" id="textoRecuperacao">
                Informe o e-mail cadastrado na sua conta para receber
                um código de recuperação.
            </p>

            <form id="formRecuperar" class="form-recuperacao">

                <input
                    type="email"
                    id="emailRecuperacao"
                    name="email"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                >

                <button id="botaoRecuperar" type="submit">
                    Enviar código
                </button>

            </form>

            <form
                id="formCodigo"
                class="form-recuperacao"
                style="display: none;"
            >

                <input
                    type="text"
                    id="codigoRecuperacao"
                    name="codigo"
                    placeholder="Código de 6 dígitos"
                    inputmode="numeric"
                    maxlength="6"
                    required
                >

                <button type="submit">
                    Verificar código
                </button>

            </form>

            <form
                id="formNovaSenha"
                class="form-recuperacao"
                style="display: none;"
            >

                <div class="campo-senha">
                    <input
                        type="password"
                        id="novaSenha"
                        name="novaSenha"
                        placeholder="Nova senha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="campo-senha">
                    <input
                        type="password"
                        id="confirmarNovaSenha"
                        name="confirmarNovaSenha"
                        placeholder="Confirmar nova senha"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">
                    Redefinir senha
                </button>

            </form>

            <div class="voltar-login">
                <a href="index.html">Voltar para o login</a>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/recuperar.js"></script>

</body>

</html>
