<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Organizador Acadêmico</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container">
    <section class="cadastro">
      <h1 id="tituloCadastro">Criar conta</h1>

      <form id="formCadastro">
        <input type="text" id="nome" placeholder="Nome completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
    
        <div class="campo-senha">
         <input type="password" id="senha" placeholder="Senha" required>
        
        </div>
         <input type="password" id="ConfirmarSenha" placeholder="Confirmar Senha" required>

        <button id="botaoCadastrar" type="submit">Cadastrar</button>
      </form>


          <div class="resultado">
                    <label class="confirmacao">
                        <input type="checkbox" href="check.html" id="confirmacao" required>
                        <span>Leia os termos e marque a caixa para <a href="check.html">confirmar.</a></span>
                    </label>
                </div>      
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
