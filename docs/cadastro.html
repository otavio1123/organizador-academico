<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Organizador Acadêmico</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/alertas.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body class="pagina-autenticacao">

<main class="container-fluid min-vh-100">

    <div class="row min-vh-100">

        <section class="col-lg-6 painel-apresentacao d-none d-lg-flex">

            <div class="conteudo-apresentacao">

                <a href="index.html" class="marca-login">

                    <img
                        src="/img/Logo.png"
                        alt="Organizador Acadêmico"
                        class="logo-login"
                    >

                    <span>
                        Organizador Acadêmico
                    </span>

                </a>

                <div class="texto-apresentacao">

                    <h1>
                        Comece a organizar sua vida acadêmica.
                    </h1>

                    <p>
                        Cadastre-se para acompanhar seus semestres,
                        disciplinas, atividades e prazos em um só lugar.
                    </p>

                </div>

            </div>

        </section>

        <section class="col-12 col-lg-6 area-cadastro">

            <div class="card-cadastro">

                <div class="cabecalho-cadastro">

                    <div class="marca-mobile d-lg-none">

                        <img
                            src="img/logo.png"
                            alt="Organizador Acadêmico"
                        >

                        <span>
                            Organizador Acadêmico
                        </span>

                    </div>

                    <span class="rotulo-cadastro">
                        Crie sua conta
                    </span>

                    <h2 id="tituloCadastro">
                        Cadastro
                    </h2>

                    <p>
                        Preencha seus dados para começar a usar o sistema.
                    </p>

                </div>

                <form id="formCadastro">

                    <div class="mb-3">

                        <label
                            for="nome"
                            class="form-label"
                        >
                            Nome completo
                        </label>

                        <div class="campo-com-icone">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="nome"
                                class="form-control"
                                placeholder="Digite seu nome completo"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            E-mail
                        </label>

                        <div class="campo-com-icone">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="seuemail@exemplo.com"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-3">

                        <label
                            for="senha"
                            class="form-label"
                        >
                            Senha
                        </label>

                        <div class="campo-com-icone campo-senha">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="senha"
                                class="form-control"
                                placeholder="Crie uma senha"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-4">

                        <label
                            for="ConfirmarSenha"
                            class="form-label"
                        >
                            Confirmar senha
                        </label>

                        <div class="campo-com-icone campo-senha">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="ConfirmarSenha"
                                class="form-control"
                                placeholder="Digite novamente sua senha"
                                required
                            >

                        </div>

                    </div>

                    <div class="confirmacao-termos mb-4">

                        <input
                            type="checkbox"
                            id="confirmacao"
                            required
                        >
                        <label for="confirmacao">
                        Li e aceito os
                       <a href="termos.html">Termos de Uso</a>
                        e estou ciente da
                       <a href="privacidade.html">Política de Privacidade</a>.
                       </label>

                    </div>

                    <button
                        type="submit"
                        id="botaoCadastrar"
                        class="btn btn-primary w-100 botao-cadastro"
                    >
                        Criar conta
                    </button>

                </form>

                <div class="separador-cadastro">
                    <span></span>
                </div>

                <p class="acesso-login-cadastro">
                    Já possui uma conta?
                    <a href="index.html">
                        Entrar
                    </a>
                </p>

            </div>

        </section>

    </div>

</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/config.js"></script>
<script src="js/cadastro.js"></script>

</body>

</html>
